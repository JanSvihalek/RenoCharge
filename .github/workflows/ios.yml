name: iOS build

# macOS runnery se u privátního repozitáře účtují desetinásobkem minut
# oproti Linuxu, proto build neběží na každý push do větve, ale jen na
# main a na ruční spuštění. Kontrola kódu a testy běží na Linuxu.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.8
  BUNDLE_ID: dev.svihalek.renocharge

jobs:
  kontrola:
    name: Analýza a testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Závislosti
        run: flutter pub get

      - name: Formátování
        run: dart format --set-exit-if-changed lib test

      - name: Analýza
        run: flutter analyze

      - name: Testy
        run: flutter test

  ios:
    name: Sestavení a TestFlight
    # Nemá smysl platit za macOS minuty, když neprojde analýza.
    needs: kontrola
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: arm64
          cache: true

      - name: Závislosti
        run: flutter pub get

      # Certifikát se importuje do dočasné klíčenky, ne do výchozí –
      # runner je sice jednorázový, ale takhle je jasné, co po sobě
      # build zanechá.
      - name: Klíčenka s podpisovým certifikátem
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/podpis.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # openssl místo base64: BSD a GNU varianta base64 se liší
          # v přepínači pro dekódování.
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Bez zařazení do seznamu klíčenek ji codesign nenajde.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "Nalezené podpisové identity:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Provisioning profil
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Xcode 16 hledá profily jinde než starší verze, tak je
          # položíme na obě místa.
          STARE="$HOME/Library/MobileDevice/Provisioning Profiles"
          NOVE="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$STARE" "$NOVE"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$STARE/build.mobileprovision"
          cp "$STARE/build.mobileprovision" "$NOVE/build.mobileprovision"

      - name: Nastavení exportu
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # Číslo buildu bere pořadí běhu. TestFlight odmítne nahrát dvakrát
      # stejné číslo, takže napevno zapsaná jednička z pubspec.yaml by
      # prošla jen jednou.
      - name: Přeložení Flutteru
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archiv
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Uložení IPA
        uses: actions/upload-artifact@v4
        with:
          name: RenoCharge-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Nahrání do TestFlightu
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool hledá klíč v ~/private_keys pod přesným názvem.
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8

          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -1)"
          echo "Nahrávám $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
